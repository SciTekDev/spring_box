version: "3.8"

# Local infrastructure for the spring_box sandbox: Consul for service discovery,
# plus the three sandbox APIs. ELK stack is intentionally left as a separate TODO
# (see TODO.md) since it needs more tuning before it's worth wiring in by default.
services:
  consul:
    image: hashicorp/consul:1.19
    container_name: spring-box-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -server -ui -node=spring-box -bootstrap-expect=1 -client=0.0.0.0"

  device-status:
    build:
      context: .
      dockerfile: device-status/Dockerfile
    container_name: spring-box-device-status
    ports:
      - "8081:8081"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      - consul

  data-store:
    build:
      context: .
      dockerfile: data-store/Dockerfile
    container_name: spring-box-data-store
    ports:
      - "8082:8082"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      - consul

  device-control:
    build:
      context: .
      dockerfile: device-control/Dockerfile
    container_name: spring-box-device-control
    ports:
      - "8083:8083"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      - consul
