version: "3.8"

# Local infrastructure for the spring_box sandbox: the three sandbox APIs. Consul
# now lives in the my_elk_stack compose project and is reachable here over the
# external "lab-network" (hostname "consul"). Start the my_elk_stack compose
# project first so that network and Consul exist, then start this project.
services:
  device-status:
    build:
      context: .
      dockerfile: device-status/Dockerfile
    container_name: spring-box-device-status
    ports:
      - "8081:8081"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    networks:
      - default
      - lab-network

  data-store:
    build:
      context: .
      dockerfile: data-store/Dockerfile
    container_name: spring-box-data-store
    ports:
      - "8082:8082"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    networks:
      - default
      - lab-network

  device-control:
    build:
      context: .
      dockerfile: device-control/Dockerfile
    container_name: spring-box-device-control
    ports:
      - "8083:8083"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    networks:
      - default
      - lab-network

networks:
  default: {}
  lab-network:
    external: true
